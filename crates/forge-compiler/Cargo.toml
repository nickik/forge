[package]
name = "forge-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-codegen-cranelift = { path = "../forge-codegen-cranelift" }
forge-frontend = { path = "../forge-frontend" }
forge-fir = { path = "../forge-fir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "forgec"
path = "src/main.rs"
