name: fir-step6-once

on:
  push:
    branches:
      - agent/fir-steps5-8-work

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fir-steps5-8-work
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply Step 6
        run: |
          python3 -B scripts/fir_step6_once.py
          python3 -B scripts/fir_step6_fix.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated Step 6
        run: |
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add -A
          git commit -m "Implement FIR structural match patterns"
          git push origin HEAD:agent/fir-steps5-8-work
