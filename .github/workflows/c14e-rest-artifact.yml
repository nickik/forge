name: C14e sequence-rest FIR artifact

on:
  push:
    branches:
      - agent/c14e-rest-format-helper

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply live sequence-rest FIR patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/forge-frontend/src/fir_v1.rs")
          source = path.read_text()
          old = r'''                if let Some(rest) = rest {
                              self.diagnostic(
                                  pattern.span,
                                  "fir/rest-pattern",
                                  format!("irrefutable rest binding {rest:?} needs slice-view lowering"),
                              );
                          }
          '''
          new = r'''                if let Some(rest) = rest {
                              let rest_ty = self
                                  .typed
                                  .local_types
                                  .get(rest)
                                  .cloned()
                                  .unwrap_or(Ty::Unknown);
                              let rest_value = self.emit_value(
                                  pattern.span,
                                  rest_ty,
                                  FirInstructionKind::Subsequence {
                                      base: value,
                                      start: items.len() as u64,
                                  },
                              );
                              self.store_local(pattern.span, *rest, rest_value);
                          }
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected one live sequence-rest seam, found {source.count(old)}")
          patched = source.replace(old, new, 1)
          if "irrefutable rest binding" in patched:
              raise SystemExit("old sequence-rest diagnostic remains")
          path.write_text(patched)
          PY
          rustfmt --edition 2024 crates/forge-frontend/src/fir_v1.rs
          cargo fmt --all -- --check

      - name: Verify patched frontend
        run: cargo test -p forge-frontend

      - name: Upload exact patched FIR source
        uses: actions/upload-artifact@v4
        with:
          name: c14e-rest-fir
          path: crates/forge-frontend/src/fir_v1.rs
          if-no-files-found: error
          retention-days: 1
