name: local-const-cleanup-once

on:
  push:
    branches:
      - agent/conformance-runner

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize migration match
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path("crates/forge-frontend/src/typecheck_v1.rs")
          text = path.read_text()
          old = '''            ResolvedName::Def(id) => constants.get(&id).cloned().ok_or_else(|| ConstEvalError {
                          span: expr.span,
                          message: format!("definition {id:?} is not an evaluable module `const`"),
                      }),
          '''
          new = '''            ResolvedName::Def(id) => constants
                          .get(&id)
                          .cloned()
                          .ok_or_else(|| ConstEvalError {
                              span: expr.span,
                              message: format!("definition {id:?} is not an evaluable module `const`"),
                          }),
          '''
          if old not in text:
              raise SystemExit("current const lookup shape not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply local const cleanup
        run: python3 -B scripts/local_const_cleanup_once.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated cleanup
        run: |
          rm scripts/local_const_cleanup_once.py
          rm .github/workflows/local-const-cleanup-once.yml
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add -A
          git commit -m "Preserve and evaluate local consts"
          git push origin HEAD:agent/conformance-runner
