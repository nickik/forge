name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fix C0/C1 validation state
        run: |
          cargo generate-lockfile
          python3 - <<'PY'
          from pathlib import Path

          boundary = Path('crates/forge-frontend/src/fir_boundary_v1.rs')
          text = boundary.read_text()
          text = text.replace('use std::collections::{BTreeMap, BTreeSet};', 'use std::collections::BTreeMap;')
          duplicate_check = '''    let mut expression_ids = BTreeSet::new();
          for expression in &body.expressions {
              if !expression_ids.insert(expression.id) {
                  diagnostics.push(diagnostic(
                      expression.span,
                      "fir/boundary-expression",
                      format!("typed expression {:?} appears more than once", expression.id),
                  ));
              }
          '''
          replacement = '''    for expression in &body.expressions {
          '''
          if duplicate_check not in text:
              raise SystemExit('expected FIR boundary duplicate-expression check not found')
          boundary.write_text(text.replace(duplicate_check, replacement))

          workflow = Path('.github/workflows/ci.yml')
          workflow.write_text('''name: ci

          on:
            push:
            pull_request:

          jobs:
            rust:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@v2
                - run: cargo fmt --all -- --check
                - run: cargo check --workspace --locked
                - run: cargo test --workspace --locked
                - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
                - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
          ''')
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/forge-frontend/src/fir_boundary_v1.rs .github/workflows/ci.yml
          git commit -m "Fix C0/C1 validation issues"
          git push origin HEAD:agent/cranelift-c0-c1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
