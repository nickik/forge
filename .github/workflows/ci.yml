name: repair-sia32-shell

on:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Repair SIA32 integration and lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/forge-codegen-cranelift/src/object_c11c.rs')
          s = p.read_text()
          old = '''    ) -> Result<NativeObject, BackendError> {\n        validate_object_plan(self.target(), prepared, plan)?;'''
          new = '''    ) -> Result<NativeObject, BackendError> {\n        if self.target() == CraneliftTarget::Sia32 {\n            return Err(object_error(\n                "SIA32 object emission uses the M8 SIAO32 writer/image builder, not legacy ELF64",\n            ));\n        }\n        validate_object_plan(self.target(), prepared, plan)?;'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('''            CraneliftTarget::Riscv64 => 243,\n        },''', '''            CraneliftTarget::Riscv64 => 243,\n            CraneliftTarget::Sia32 => unreachable!("SIA32 is rejected before ELF64 emission"),\n        },''', 1)
          s = s.replace('''            CraneliftTarget::Riscv64 => 0x5,\n        },''', '''            CraneliftTarget::Riscv64 => 0x5,\n            CraneliftTarget::Sia32 => unreachable!("SIA32 is rejected before ELF64 emission"),\n        },''', 1)
          p.write_text(s)
          PY
          cargo check -p forge-codegen-cranelift
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          cargo fmt --all -- --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Cargo.lock crates/forge-codegen-cranelift/src/object_c11c.rs .github/workflows/ci.yml
          git commit -m 'Fix SIA32 target integration gate'
          git push origin HEAD:sia32-integration-shell
