name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        timeout-minutes: 2
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      - name: Workspace check
        timeout-minutes: 5
        run: cargo check --workspace --locked

      # Keep likely source failures ahead of native acceptance while sharing one
      # runner/cache so a green commit does not consume duplicate Actions time.
      - name: Frontend tests
        timeout-minutes: 5
        run: cargo test -p forge-frontend --locked -- --nocapture
      - name: Clippy
        timeout-minutes: 8
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion

      - name: Build-system tests
        timeout-minutes: 5
        run: cargo test -p forge-build --locked -- --nocapture
      - name: C14 native build-system integration
        timeout-minutes: 5
        run: |
          cargo build -p forge-build -p forge-compiler --bins --locked
          export PATH="$PWD/target/debug:$PATH"
          forge check --manifest-path examples/c14-build-system/forge.fdn
          forge build --manifest-path examples/c14-build-system/forge.fdn --target app
          test -x examples/c14-build-system/build/app
          test "$(forge run --manifest-path examples/c14-build-system/forge.fdn --target app -- alpha beta)" = "run-ok"
          forge test --manifest-path examples/c14-build-system/forge.fdn --target smoke
          forge build --manifest-path examples/c14-build-system/forge.fdn --target kernel
          test -s examples/c14-build-system/build/kernel.o
          forge check --manifest-path examples/c14-build-system/forge.fdn --target lib
      - name: C14 native executable specification
        timeout-minutes: 5
        run: scripts/run-c14-native-spec.sh
      - name: SIA32 Lighting firmware bring-up
        timeout-minutes: 3
        run: |
          cargo run --quiet -p forge-compiler --bin forge-lighting-firmware -- \
            "$PWD/examples/lighting/firmware_hello.fg" -o /tmp/forge-lighting.s
          grep -q '^forge_entry:' /tmp/forge-lighting.s
          grep -q '^unexpected_trap:' /tmp/forge-lighting.s
          if cargo run --quiet -p forge-compiler --bin forge-lighting-firmware -- \
            "$PWD/examples/lighting/firmware_functions.fg" -o /tmp/forge-lighting-functions.s \
            2>/tmp/forge-lighting-functions.err; then
            test -s /tmp/forge-lighting-functions.s
          else
            grep -Eq 'relocation|machine-code relocations|SIA32' /tmp/forge-lighting-functions.err
          fi

      - name: Generated native collections snapshot
        timeout-minutes: 3
        run: |
          cargo run --quiet -p forge-build --locked --bin forge-collections-gen -- /tmp/forge-collections-native.fg
          diff -u packages/forge-collections-native/src/lib.fg /tmp/forge-collections-native.fg
      - name: Conformance suite
        timeout-minutes: 5
        run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - name: Install RV64 execution tools
        timeout-minutes: 3
        run: |
          if ! command -v qemu-riscv64 >/dev/null || ! command -v riscv64-linux-gnu-as >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y qemu-user binutils-riscv64-linux-gnu
          fi
          qemu-riscv64 --version
          riscv64-linux-gnu-as --version | head -1
      - name: Remaining workspace tests with RV64 execution
        timeout-minutes: 10
        env:
          FORGE_RISCV64_EXECUTION: "1"
        run: cargo test --workspace --exclude forge-frontend --locked -- --nocapture
