name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - name: Test workspace
        run: |
          set -o pipefail
          timeout 120s cargo test --workspace -- --nocapture 2>&1 | tee cargo-test.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-log
          path: cargo-test.log
      - name: Run Forge conformance suite
        run: |
          set -o pipefail
          timeout 60s cargo run -p forge-conformance -- examples/conformance/suite.fdn 2>&1 | tee conformance.log
      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-log
          path: conformance.log
      - run: cargo clippy --workspace --all-targets -- -D warnings
