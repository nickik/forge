name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        timeout-minutes: 2
        run: cargo fmt -p forge-frontend -p forge-fir -p forge-conformance -p forge-codegen-cranelift -- --check
      - name: Workspace check
        timeout-minutes: 5
        run: cargo check --workspace --locked
      - name: Build-system tests
        timeout-minutes: 5
        run: cargo test -p forge-build -- --nocapture
      - name: Generated native collections snapshot
        timeout-minutes: 3
        run: |
          cargo run --quiet -p forge-build --bin forge-collections-gen -- /tmp/forge-collections-native.fg
          diff -u packages/forge-collections-native/src/lib.fg /tmp/forge-collections-native.fg
      - name: Frontend tests
        timeout-minutes: 5
        run: cargo test -p forge-frontend -- --nocapture
      - name: Workspace tests
        timeout-minutes: 10
        run: cargo test --workspace --locked -- --nocapture
      - name: Conformance suite
        timeout-minutes: 5
        run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - name: Clippy
        timeout-minutes: 8
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
