name: repair-sia32-test-exhaustiveness

on:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch test-only backend rebuild helpers and restore CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('crates/forge-codegen-cranelift/tests/c4a_integer_ops.rs'),
              Path('crates/forge-codegen-cranelift/tests/c4b_scalar_integers.rs'),
          ]
          for p in files:
              s = p.read_text()
              needle = '''            forge_codegen_cranelift::CraneliftTarget::Riscv64 => {\n                CraneliftBackend::riscv64().expect("RISC-V64 backend")\n            }\n'''
              replacement = needle + '''            forge_codegen_cranelift::CraneliftTarget::Sia32 => {\n                panic!("SIA32 CLIF lowering is intentionally unavailable before M5")\n            }\n'''
              if needle not in s:
                  needle = '''        forge_codegen_cranelift::CraneliftTarget::Riscv64 => {\n            CraneliftBackend::riscv64().expect("RV64")\n        }\n'''
                  replacement = needle + '''        forge_codegen_cranelift::CraneliftTarget::Sia32 => {\n            panic!("SIA32 CLIF lowering is intentionally unavailable before M5")\n        }\n'''
              assert needle in s, p
              p.write_text(s.replace(needle, replacement, 1))
          PY
          cargo fmt --all -- --check
          cargo test -p forge-codegen-cranelift --no-run --locked
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add crates/forge-codegen-cranelift/tests/c4a_integer_ops.rs crates/forge-codegen-cranelift/tests/c4b_scalar_integers.rs .github/workflows/ci.yml
          git commit -m 'Keep legacy integer tests on implemented targets'
          git push origin HEAD:sia32-integration-shell
