name: ci

on:
  push:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact formatter and refresh lock
        run: |
          cargo fmt --all
          cargo check -p forge-codegen-cranelift
      - name: Commit generated formatting and lock state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/forge-codegen-cranelift/Cargo.toml crates/forge-codegen-cranelift/src/sia32_object.rs crates/forge-codegen-cranelift/src/sia32_image.rs crates/forge-codegen-cranelift/src/lib.rs crates/forge-codegen-cranelift/tests/sia32_m8_relocations.rs crates/forge-codegen-cranelift/tests/sia32_m8_object_link.rs crates/forge-codegen-cranelift/tests/sia32_m8_image.rs crates/forge-codegen-cranelift/tests/sia32_m8_runtime.rs
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Apply exact M8.3/M8.4 generated state"
            git push
          fi
