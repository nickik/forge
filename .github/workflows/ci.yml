name: ci

on:
  push:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply formatter and capture check
        run: |
          cargo fmt --all
          set +e
          cargo check -p forge-codegen-cranelift > M8_DIAG.txt 2>&1
          echo $? > M8_STATUS.txt
          exit 0
      - name: Commit generated state and diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Capture exact M8.3/M8.4 generated state"
          git push
