name: C13 initial compatibility fixes

on:
  push:
    branches: [agent/cranelift-c13-native-existing-code]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cranelift-c13-native-existing-code
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/forge-compiler/src/module_linker.rs')
          text = p.read_text()
          old = '''    for library in libraries {\n        let declared = library\n            .ast\n            .module\n            .segments\n            .last()\n            .cloned()\n            .ok_or_else(|| format!("library `{}` has an empty module path", library.name))?;\n        if declared != library.name {\n            return Err(format!(\n                "--library {}=... provides module `{}`, whose import alias is `{declared}`",\n                library.name,\n                library.ast.module.segments.join(".")\n            ));\n        }\n        if plans.contains_key(&library.name) {\n            return Err(format!("duplicate library `{}`", library.name));\n        }\n        plans.insert(\n            library.name.clone(),\n            plan_module(library.name, library.ast, true),\n        );\n    }\n'''
          new = '''    for library in libraries {\n        let module_name = library.ast.module.segments.join(".");\n        let alias = library\n            .ast\n            .module\n            .segments\n            .last()\n            .cloned()\n            .ok_or_else(|| format!("library `{}` has an empty module path", library.name))?;\n        if library.name != alias && library.name != module_name {\n            return Err(format!(\n                "--library {}=... provides module `{module_name}`; expected the full module name or import alias `{alias}`",\n                library.name\n            ));\n        }\n        if plans.contains_key(&alias) {\n            return Err(format!("duplicate library import alias `{alias}`"));\n        }\n        plans.insert(alias, plan_module(module_name, library.ast, true));\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('module linker source shape changed')
          p.write_text(text.replace(old, new, 1))

          p = Path('crates/forge-frontend/src/lexer.rs')
          text = p.read_text()
          old = '#[regex(r"([A-Za-z][A-Za-z0-9_]*|_[A-Za-z0-9][A-Za-z0-9_]*)", |lex| lex.slice().to_owned())]'
          new = '#[regex(r"([A-Za-z][A-Za-z0-9_]*|_+[A-Za-z0-9][A-Za-z0-9_]*)", |lex| lex.slice().to_owned())]'
          if text.count(old) != 1:
              raise SystemExit('lexer identifier source shape changed')
          p.write_text(text.replace(old, new, 1))
          PY

          cat > crates/forge-frontend/tests/c13_identifiers.rs <<'EOF'
          use forge_frontend::lexer::Token;
          use logos::Logos;

          #[test]
          fn provider_identifiers_may_start_with_multiple_underscores() {
              let mut lexer = Token::lexer("__forge_console_write _ _hidden");
              assert_eq!(
                  lexer.next().expect("provider token").expect("provider lexes"),
                  Token::Ident("__forge_console_write".to_owned())
              );
              assert_eq!(
                  lexer.next().expect("wildcard token").expect("wildcard lexes"),
                  Token::Underscore
              );
              assert_eq!(
                  lexer.next().expect("hidden token").expect("hidden lexes"),
                  Token::Ident("_hidden".to_owned())
              );
              assert!(lexer.next().is_none());
          }
          EOF

          mkdir -p crates/forge-compiler/tests
          cat > crates/forge-compiler/tests/c13_existing_compat.rs <<'EOF'
          use forge_compiler::compile_source_with_library_sources;

          #[test]
          fn accepts_full_declared_module_name_as_library_key() {
              let library = r#"
          module cosmic.kernel.memory.address_space;

          pub fn answer() -> i32 {
              return 42;
          }
          "#;
              let root = r#"
          module cosmic.tests.smoke;

          import cosmic.kernel.memory.address_space;

          fn main() -> i32 {
              return address_space.answer() - 42;
          }
          "#;
              compile_source_with_library_sources(
                  root,
                  &[("cosmic.kernel.memory.address_space".to_owned(), library.to_owned())],
              )
              .expect("full module path library key should compile");
          }
          EOF

          cargo fmt --all
      - name: Verify targeted compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p forge-frontend --test c13_identifiers --locked
          cargo test -p forge-compiler --test c13_existing_compat --locked
          cargo test -p forge-compiler --locked
      - name: Commit verified fixes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c13-fix-initial-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'C13: accept existing module names and provider identifiers'
          git push origin HEAD:agent/cranelift-c13-native-existing-code
