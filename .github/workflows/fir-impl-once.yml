name: fir-impl-once

on:
  push:
    branches:
      - agent/conformance-runner

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize call-argument migration match
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path("crates/forge-frontend/src/typecheck_v1.rs")
          text = path.read_text()
          old = '''            let required = sig.params.iter().filter(|p| !p.has_default).count();
                      if args.len() < required {
                          self.diagnostic(
                              span,
                              "call/arity",
                              format!(
                                  "expected at least {required} arguments, found {}",
                                  args.len()
                              ),
                          );
                      }
          '''
          new = '''            for param in sig.params.iter().skip(args.len()) {
                          if !param.has_default {
                              self.diagnostic(
                                  span,
                                  "call/missing-argument",
                                  format!("missing required argument `{}`", param.name),
                              );
                          }
                      }
          '''
          if old not in text:
              raise SystemExit("current positional-argument tail not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply FIR implementation
        run: python3 -B scripts/fir_impl_once.py
      - name: Normalize generated FIR source
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path("crates/forge-frontend/src/fir_v1.rs")
          text = path.read_text()
          text = text.replace('#[serde(tag = "op", rename_all = "snake_case")]', '#[serde(tag = "instruction", rename_all = "snake_case")]', 1)
          text = text.replace('HirExpr, HirExprKind, HirMatchBody,\n        HirPattern,', 'HirExpr, HirExprKind, HirPattern,', 1)
          path.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated FIR
        run: |
          rm scripts/fir_impl_once.py
          rm .github/workflows/fir-impl-once.yml
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add -A
          git commit -m "Implement Forge FIR lowering"
          git push origin HEAD:agent/conformance-runner
