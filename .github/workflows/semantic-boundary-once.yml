name: semantic-boundary-once

on:
  push:
    branches:
      - agent/conformance-runner

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 -B scripts/semantic_boundary_once.py
      - run: cargo fmt --all
      - run: python3 -B scripts/semantic_boundary_phase2_prepatch_v2.py
      - run: python3 -B scripts/semantic_boundary_phase2.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
