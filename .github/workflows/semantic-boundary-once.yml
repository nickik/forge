name: semantic-boundary-once

on:
  push:
    branches:
      - agent/conformance-runner

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 -B scripts/semantic_boundary_once.py
      - run: cargo fmt --all
      - run: python3 -B scripts/semantic_boundary_phase2_prepatch_v2.py
      - run: python3 -B scripts/semantic_boundary_phase2.py
      - run: python3 -B scripts/semantic_boundary_phase2_postpatch.py
      - run: python3 -B scripts/semantic_boundary_phase2_cleanup.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit semantic normalization
        run: |
          rm -f scripts/semantic_boundary_once.py
          rm -f scripts/semantic_boundary_phase2.py
          rm -f scripts/semantic_boundary_phase2_prepatch.py
          rm -f scripts/semantic_boundary_phase2_prepatch_v2.py
          rm -f scripts/semantic_boundary_phase2_postpatch.py
          rm -f scripts/semantic_boundary_phase2_protocol_fix.py
          rm -f scripts/semantic_boundary_phase2_cleanup.py
          rm -f .github/workflows/semantic-boundary-once.yml
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add -A
          git commit -m "Normalize Forge semantic FIR boundary"
          git push origin HEAD:agent/conformance-runner
