name: semantic-cleanup-once

on:
  push:
    branches:
      - agent/conformance-runner

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Repair migration script
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path("scripts/semantic_cleanup_once.py")
          text = path.read_text()
          block = '''replace_all(
              "crates/forge-frontend/src/typecheck_v1.rs",
              'Ty::Array { element }',
              'Ty::Array { element, .. }',
          )
          '''
          text = text.replace(block, "")
          path.write_text(text)
          PY
      - name: Apply semantic cleanup
        run: python3 -B scripts/semantic_cleanup_once.py
      - name: Propagate expected match type
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path("crates/forge-frontend/src/typecheck_v1.rs")
          text = path.read_text()
          old = '''                        crate::body_hir::HirMatchBody::Expr(e) => self.check_expr(
                            e,
                            if result == Ty::Unknown {
                                None
                            } else {
                                Some(&result)
                            },
                        ),
          '''
          new = '''                        crate::body_hir::HirMatchBody::Expr(e) => self.check_expr(
                            e,
                            if result == Ty::Unknown {
                                expected
                            } else {
                                Some(&result)
                            },
                        ),
          '''
          if old not in text:
              raise SystemExit("match contextual typing block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated cleanup
        run: |
          rm scripts/semantic_cleanup_once.py
          rm .github/workflows/semantic-cleanup-once.yml
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add -A
          git commit -m "Tighten Forge semantic lowering"
          git push origin HEAD:agent/conformance-runner
