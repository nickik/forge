name: one-shot-hir-builtin-types

on:
  push:
    branches: [agent/conformance-runner]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry HIR identity tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - name: Patch builtin type identity and OR-pattern tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/forge-frontend/src/body_hir_v1.rs')
          s = p.read_text()
          s = s.replace('    Builtin,\n    Error,', '    Builtin { name: String },\n    Error,', 1)
          s = s.replace('return HirTypeRef::Builtin;', 'return HirTypeRef::Builtin { name: name.clone() };', 1)
          p.write_text(s)

          tc = Path('crates/forge-frontend/src/typecheck_v1.rs')
          s = tc.read_text().replace('let mut env = ModuleTypeEnv::build(source, module);', 'let env = ModuleTypeEnv::build(source, module);', 1)
          tc.write_text(s)

          t = Path('crates/forge-frontend/tests/body_hir.rs')
          s = t.read_text()
          s += r'''

          #[test]
          fn or_pattern_alternatives_share_logical_local_ids() {
              let output = lower(
                  r#"
                  module test.or_identity;
                  tagged Choice { Left { value: i32; }, Right { value: i32; } }
                  fn pick(c: Choice) -> i32 {
                      return match (c) {
                          Choice::Left{value: x} | Choice::Right{value: x} => x,
                      };
                  }
                  "#,
              );
              assert!(output.diagnostics.is_empty(), "{:?}", output.diagnostics);
              let body = output.functions.get(&forge_frontend::DefId(1)).expect("pick body");
              let forge_frontend::body_hir::HirStmtKind::Return { value: Some(expr), .. } = &body.block.statements[0].kind else { panic!("return") };
              let forge_frontend::body_hir::HirExprKind::Match { arms, .. } = &expr.kind else { panic!("match") };
              let forge_frontend::body_hir::HirPatternKind::Or { patterns } = &arms[0].pattern.kind else { panic!("or pattern") };
              fn bound_id(p: &forge_frontend::body_hir::HirPattern) -> forge_frontend::LocalId {
                  use forge_frontend::body_hir::HirPatternKind;
                  match &p.kind {
                      HirPatternKind::Variant { fields, .. } => {
                          let nested = fields[0].pattern.as_ref().expect("field pattern");
                          match nested.kind { HirPatternKind::Binding { local, .. } => local, _ => panic!("binding") }
                      }
                      _ => panic!("variant"),
                  }
              }
              assert_eq!(bound_id(&patterns[0]), bound_id(&patterns[1]));
          }

          #[test]
          fn or_pattern_requires_identical_binding_names() {
              let output = lower(
                  r#"
                  module test.or_names;
                  tagged Choice { Left { value: i32; }, Right { value: i32; } }
                  fn pick(c: Choice) -> i32 {
                      return match (c) {
                          Choice::Left{value: x} | Choice::Right{value: y} => 0,
                      };
                  }
                  "#,
              );
              assert!(output.diagnostics.iter().any(|d| d.message.contains("OR-pattern alternatives must bind the same names")));
          }
          '''
          t.write_text(s)
          PY
      - name: Format and test
        run: |
          cargo fmt --all
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
          cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit patch
        run: |
          git config user.name 'forge-ci'
          git config user.email 'forge-ci@users.noreply.github.com'
          git add crates/forge-frontend/src/body_hir_v1.rs crates/forge-frontend/src/typecheck_v1.rs crates/forge-frontend/tests/body_hir.rs
          git commit -m 'Preserve builtin and OR-pattern type identity'
          git push origin HEAD:agent/conformance-runner
