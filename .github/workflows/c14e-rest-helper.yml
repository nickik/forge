name: C14e rest lowering helper

on:
  push:
    branches:
      - agent/c14e-rest-format-helper

permissions:
  contents: write

jobs:
  patch-and-format:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c14e-rest-format-helper
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact FIR patch and fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/forge-frontend/src/fir_v1.rs')
          text = path.read_text()
          old = '''                if let Some(rest) = rest {
                    self.diagnostic(
                        pattern.span,
                        "fir/rest-pattern",
                        format!("irrefutable rest binding {rest:?} needs slice-view lowering"),
                    );
                }
'''
          new = '''                if let Some(rest) = rest {
                    let rest_ty = self
                        .typed
                        .local_types
                        .get(rest)
                        .cloned()
                        .unwrap_or(Ty::Unknown);
                    let rest_value = self.emit_value(
                        pattern.span,
                        rest_ty,
                        FirInstructionKind::Subsequence {
                            base: value,
                            start: items.len() as u64,
                        },
                    );
                    self.store_local(pattern.span, *rest, rest_value);
                }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one rest-pattern lowering site, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          fixture = Path('examples/c14-native-spec/run/irrefutable_rest.fg')
          fixture.write_text('''module c14_native_spec.irrefutable_rest;

fn main() -> i32 {
    val values: [i32; 4] = [10i32, 20i32, 30i32, 40i32];
    val [first, ..rest] = values;
    if (first != 10i32) { return 1; }
    if (rest[0usize] != 20i32) { return 2; }
    if (rest[2usize] != 40i32) { return 3; }

    val rows: [[i32; 3]; 2] = [
        [1i32, 2i32, 3i32],
        [4i32, 5i32, 6i32],
    ];
    var total: i32 = 0i32;
    for (val [head, ..tail] in rows) {
        total = total + head + tail[0usize] + tail[1usize];
    }
    if (total != 21i32) { return 4; }
    return 0;
}
''')
          PY
          cargo fmt --all
      - name: Commit formatted result
        shell: bash
        run: |
          rm .github/workflows/c14e-rest-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "C14e: lower irrefutable sequence rest"
          git push origin HEAD:agent/c14e-rest-format-helper
