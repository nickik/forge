name: C14e rest lowering helper

on:
  push:
    branches:
      - agent/c14e-rest-format-helper

jobs:
  patch-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact FIR patch and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/forge-frontend/src/fir_v1.rs')
          text = path.read_text()
          old = '''                if let Some(rest) = rest {
                    self.diagnostic(
                        pattern.span,
                        "fir/rest-pattern",
                        format!("irrefutable rest binding {rest:?} needs slice-view lowering"),
                    );
                }
'''
          new = '''                if let Some(rest) = rest {
                    let rest_ty = self
                        .typed
                        .local_types
                        .get(rest)
                        .cloned()
                        .unwrap_or(Ty::Unknown);
                    let rest_value = self.emit_value(
                        pattern.span,
                        rest_ty,
                        FirInstructionKind::Subsequence {
                            base: value,
                            start: items.len() as u64,
                        },
                    );
                    self.store_local(pattern.span, *rest, rest_value);
                }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one rest-pattern lowering site, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          echo 'BEGIN_FIR_V1_BASE64'
          base64 -w0 crates/forge-frontend/src/fir_v1.rs
          echo
          echo 'END_FIR_V1_BASE64'
          sha256sum crates/forge-frontend/src/fir_v1.rs
