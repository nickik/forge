name: fir-steps-2-4-once

on:
  push:
    branches:
      - agent/fir-step1-match

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fir-step1-match
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply FIR completion steps 2-4
        run: python3 -B scripts/fir_steps_2_4_once.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated FIR steps 2-4
        run: |
          rm scripts/fir_steps_2_4_once.py
          rm .github/workflows/fir-steps-2-4-once.yml
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add -A
          git commit -m "Implement FIR Option and variant matches"
          git push origin HEAD:agent/fir-step1-match
