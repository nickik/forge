name: one-shot-resolved-hir-fixes

on:
  push:
    branches: [agent/conformance-runner]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry resolved HIR fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - name: Patch resolved HIR
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/forge-frontend/src/body_hir_v1.rs')
          s = p.read_text()
          s = s.replace('#[serde(tag = "pattern", rename_all = "snake_case")]', '#[serde(tag = "pattern_kind", rename_all = "snake_case")]', 1)
          s = s.replace(
          '''pub struct HirBody {\n    pub owner: DefId,\n    pub locals: Vec<HirLocalDecl>,\n    pub block: HirBlock,\n}''',
          '''pub struct HirBody {\n    pub owner: DefId,\n    pub params: Vec<(LocalId, HirType)>,\n    pub return_type: Option<HirType>,\n    pub locals: Vec<HirLocalDecl>,\n    pub block: HirBlock,\n}''')
          s = s.replace(
          '''                let locals = lowerer.locals;\n                let _ = params;\n                output.functions.insert(owner, HirBody { owner, locals, block });\n                let _ = return_type;''',
          '''                let locals = lowerer.locals;\n                output.functions.insert(\n                    owner,\n                    HirBody { owner, params, return_type, locals, block },\n                );''')
          s = s.replace(
          '''        if let Some(index) = self.imports.get(name).copied() { return ResolvedName::Import(index); }\n        self.diagnostics.push''',
          '''        if let Some(index) = self.imports.get(name).copied() { return ResolvedName::Import(index); }\n        if matches!(name, "Some") { return ResolvedName::BuiltinValue; }\n        self.diagnostics.push''')
          p.write_text(s)

          p = Path('crates/forge-frontend/src/resolution_v1.rs')
          s = p.read_text()
          s = s.replace(
          '''    Import(u32),\n    BuiltinType,''',
          '''    Import(u32),\n    BuiltinType,\n    BuiltinValue,''')
          s = s.replace(
          '''        if let Some(index) = self.imports.get(name).copied() {\n            self.record_use(name, span, ResolvedName::Import(index));\n            return;\n        }\n        self.diagnostics.push''',
          '''        if let Some(index) = self.imports.get(name).copied() {\n            self.record_use(name, span, ResolvedName::Import(index));\n            return;\n        }\n        if matches!(name, "Some") {\n            self.record_use(name, span, ResolvedName::BuiltinValue);\n            return;\n        }\n        self.diagnostics.push''')
          p.write_text(s)
          PY
      - name: Format and test
        run: |
          cargo fmt --all
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
          cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit patch
        run: |
          git config user.name 'forge-ci'
          git config user.email 'forge-ci@users.noreply.github.com'
          git add crates/forge-frontend/src/body_hir_v1.rs crates/forge-frontend/src/resolution_v1.rs
          git commit -m 'Complete resolved HIR core'
          git push origin HEAD:agent/conformance-runner
