name: integrate-main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main, preserving both lines where possible
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          # Normal three-way merge; on overlapping hunks prefer the validated
          # compiler/Cranelift side. Non-overlapping main changes are retained.
          git merge --no-commit --no-ff -X ours origin/main || true
          if git ls-files -u | grep -q .; then
            echo 'Unresolved conflicts remain:'
            git status --short
            exit 1
          fi
          # Do not make the bot push workflow changes; keep this branch's workflows.
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/integrate-main.yml
          git add -A
          git commit -m 'Integrate current main into Cranelift C0/C1 [integrated-main]'
          git push origin HEAD:agent/cranelift-c0-c1-integration
