name: C14e explicit panic materialization

on:
  push:
    branches: [agent/c14e-panic-helper]

permissions:
  contents: write

jobs:
  panic:
    if: ${{ !contains(github.event.head_commit.message, '[panic-materialized]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Materialize explicit panic support
        run: |
          python3 scripts/c14e-panic-materialize.py
          cargo fmt --all
      - name: Focused compiler and provider tests
        run: cargo test -p forge-compiler --locked -- --nocapture
      - name: Focused C14 native executable specification
        run: |
          cargo build -p forge-compiler --bin forgec --locked
          scripts/run-c14-native-spec.sh
      - name: Commit semantic panic patch
        run: |
          git config user.name "Nick Zbinden"
          git config user.email "niklaus.zbinden@gmail.com"
          git add lib/core.fg crates/forge-compiler/src/hosted_runtime.rs scripts/run-c14-native-spec.sh examples/c14-native-spec/trap_panic.fg
          git diff --cached --check
          git commit -m "C14e: add explicit native panic [panic-materialized] [skip ci]"
          git push
