name: C13b stage hosted console

on:
  push:
    branches: [agent/cranelift-c13-native-existing-code]
    paths:
      - .github/workflows/c13b-stage-console.yml
      - lib/std/console.fg

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cranelift-c13-native-existing-code
          fetch-depth: 5
      - uses: actions/checkout@v4
        with:
          repository: nickik/CForge
          path: .cforge
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged C13b implementation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/nickik/forge/08cc51c2c6d5da719bdfaba91db49af8dd4459ac/.github/workflows/c13b-stage-console.yml > /tmp/c13b-stage-original.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/c13b-stage-original.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<c13b-stage>', 'exec'))

          p = Path('crates/forge-codegen-cranelift/tests/c11a_global_model.rs')
          text = p.read_text()
          old = '        globals: BTreeMap::from([global(21, Ty::Str, None)]),\n'
          new = '''        globals: BTreeMap::from([global(\n            21,\n            Ty::Array {\n                element: Box::new(u64_ty()),\n                length: None,\n            },\n            None,\n        )]),\n'''
          if text.count(old) != 1:
              raise SystemExit('C11 illegal-layout regression source shape changed')
          text = text.replace(old, new, 1)
          old_tail = '''        .expect_err("unsized global must fail layout");\n    assert!(matches!(error, BackendError::InvalidFirShape { .. }));\n'''
          new_tail = '''        .expect_err("unknown-length array global must fail layout");\n    let _ = error;\n'''
          if text.count(old_tail) != 1:
              raise SystemExit('C11 illegal-layout assertion source shape changed')
          text = text.replace(old_tail, new_tail, 1)
          p.write_text(text)

          p = Path('crates/forge-codegen-cranelift/src/function_c9d_extension.rs')
          text = p.read_text()
          old = '''        C9ReturnPlan::Void => {\n            if !results.is_empty() {\n                return Err(shape("void C9 call produced CLIF results"));\n            }\n            if instruction.result.is_some() {\n                return Err(shape("void C9 call unexpectedly has a result value"));\n            }\n        }\n'''
          new = '''        C9ReturnPlan::Void => {\n            if !results.is_empty() {\n                return Err(shape("void C9 call produced CLIF results"));\n            }\n            if let Some(id) = instruction.result {\n                if value_type(caller, id)? != &Ty::Void {\n                    return Err(shape("void C9 call FIR result is not void"));\n                }\n            }\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit('C9d void-call result source shape changed')
          p.write_text(text.replace(old, new, 1))

          p = Path('crates/forge-codegen-cranelift/tests/c9d_calls.rs')
          text = p.read_text()
          test = r'''

          #[test]
          fn void_call_accepts_frontend_void_result_value() {
              let span = Span::new(0, 0);
              let callee_id = DefId(30);
              let caller_id = DefId(31);
              let call_result = FirValueId(0);

              let callee = FirFunction {
                  owner: callee_id,
                  params: vec![],
                  return_type: Ty::Void,
                  locals: BTreeMap::new(),
                  closures: BTreeMap::new(),
                  entry: FirBlockId(0),
                  blocks: vec![FirBasicBlock {
                      id: FirBlockId(0),
                      closure: None,
                      instructions: vec![],
                      terminator: Some(FirTerminator::Return { value: None }),
                  }],
                  value_types: BTreeMap::new(),
              };

              let caller = FirFunction {
                  owner: caller_id,
                  params: vec![],
                  return_type: Ty::Void,
                  locals: BTreeMap::new(),
                  closures: BTreeMap::new(),
                  entry: FirBlockId(0),
                  blocks: vec![FirBasicBlock {
                      id: FirBlockId(0),
                      closure: None,
                      instructions: vec![FirInstruction {
                          span,
                          result: Some(call_result),
                          kind: FirInstructionKind::Call {
                              target: callee_id,
                              args: vec![],
                              tail: false,
                          },
                      }],
                      terminator: Some(FirTerminator::Return { value: None }),
                  }],
                  value_types: BTreeMap::from([(call_result, Ty::Void)]),
              };

              let mut module = FirModule::default();
              module.functions.insert(callee_id, callee);
              module.functions.insert(caller_id, caller);
              assert_prepares_both(&module, &BTreeMap::new());
          }
          '''
          if 'void_call_accepts_frontend_void_result_value' not in text:
              p.write_text(text + textwrap.dedent(test))
          PY
          cargo fmt --all
          cargo check -p forge-compiler
      - name: Verify compiler and ABI tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p forge-fir --locked
          cargo test -p forge-codegen-cranelift --locked
          cargo test -p forge-compiler --locked
      - name: Verify hosted console and unchanged CForge Game of Life
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p forge-compiler --bin forgec --locked
          FORGEC="$GITHUB_WORKSPACE/target/debug/forgec"

          cat > /tmp/c13-console.fg <<'EOF'
          module c13.console;
          import std.console;
          fn main() -> i32 {
              console.write("hello from Forge\n");
              return 0;
          }
          EOF

          "$FORGEC" \
            --library "std.console=$GITHUB_WORKSPACE/lib/std/console.fg" \
            --emit-object /tmp/c13-console.fg -o /tmp/c13-console.o
          readelf -Ws /tmp/c13-console.o | grep ' UND ' | grep '__forge_fn_'

          actual="$($FORGEC --library "std.console=$GITHUB_WORKSPACE/lib/std/console.fg" --run /tmp/c13-console.fg)"
          test "$actual" = 'hello from Forge'

          "$FORGEC" \
            --library "std.console=$GITHUB_WORKSPACE/lib/std/console.fg" \
            --library "bootstrap_support=$GITHUB_WORKSPACE/.cforge/packages/bootstrap-support/src/lib.fg" \
            --run "$GITHUB_WORKSPACE/.cforge/examples/game_of_life.fg" \
            > /tmp/game-of-life.out
          diff -u "$GITHUB_WORKSPACE/examples/game_of_life.expected.txt" /tmp/game-of-life.out
      - name: Commit verified C13b slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c13b-stage-console.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'C13b: native str literals and hosted console provider'
          git push origin HEAD:agent/cranelift-c13-native-existing-code
