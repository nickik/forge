name: metadata-model-once

on:
  push:
    branches:
      - agent/conformance-runner

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Repair and validate migration script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/metadata_model_once.py")
          text = path.read_text()
          text = text.replace(
              'syntax = read("docs/forge-v1-syntax-decisions.md")nstart =',
              'syntax = read("docs/forge-v1-syntax-decisions.md")\nstart =',
          )
          marker = "# ---------------------------------------------------------------------------\n# Body HIR: remove expression/type annotation wrapper nodes.\n"
          insertion = '''replace_once(
              "crates/forge-frontend/src/parser_v1.rs",
              """        ExprKind::Annotated { value, .. } => validate_expr(value, diagnostics),\\n""",
              "",
          )
          replace_once(
              "crates/forge-frontend/src/resolution_v1.rs",
              """            TypeKind::Pointer { inner, .. }\\n            | TypeKind::Reference { inner, .. }\\n            | TypeKind::Optional { inner }\\n            | TypeKind::Annotated { inner, .. } => self.resolve_type(inner),\\n""",
              """            TypeKind::Pointer { inner, .. }\\n            | TypeKind::Reference { inner, .. }\\n            | TypeKind::Optional { inner } => self.resolve_type(inner),\\n""",
          )
          replace_once(
              "crates/forge-frontend/src/resolution_v1.rs",
              """            ExprKind::Unary { value, .. }\\n            | ExprKind::Try { value }\\n            | ExprKind::Annotated { value, .. } => self.resolve_expr(value),\\n""",
              """            ExprKind::Unary { value, .. } | ExprKind::Try { value } => {\\n                self.resolve_expr(value)\\n            }\\n""",
          )

          '''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit("parser/body HIR insertion marker missing")
              text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)
          PY
          python3 -m py_compile scripts/metadata_model_once.py
      - name: Apply metadata model migration
        run: python3 scripts/metadata_model_once.py
      - name: Update positive metadata fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("examples/conformance/parse/05-resolved-v1-syntax.fg")
          text = path.read_text()
          text = text.replace(
              "type Percentage = u8 @range(0..=100);",
              "@range(0..=100)\ntype Percentage = u8;",
          )
          text = text.replace(
              "    val unchecked = point.x @unchecked;",
              "    val field = point.x;",
          ).replace(
              "return inc(add_x(result + unchecked));",
              "return inc(add_x(result + field));",
          )
          path.write_text(text)

          path = Path("examples/conformance/parse/07-declarations-types.fg")
          text = path.read_text().replace(
              "type Percentage = u8 @range(0..=100);",
              "@range(0..=100)\ntype Percentage = u8;",
          )
          path.write_text(text)

          path = Path("examples/conformance/parse/17-postfix-chains.fg")
          text = path.read_text().replace(
              "    val unchecked = values[index] @unchecked;",
              "    val indexed = values[index];",
          )
          path.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated migration
        run: |
          rm scripts/metadata_model_once.py
          rm .github/workflows/metadata-model-once.yml
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add -A
          git commit -m "Simplify and propagate Forge metadata"
          git push origin HEAD:agent/conformance-runner
