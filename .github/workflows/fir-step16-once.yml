name: fir-step16-once
on:
  push:
    branches: [agent/fir-step16-work]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fir-step16-work
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply Step 16
        run: python3 tools/fir_step16_apply.py
      - name: Generate FIR golden
        run: UPDATE_FIR_GOLDEN=1 cargo test -p forge-frontend --test fir fir_dump_golden_is_stable -- --nocapture
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated Step 16
        run: |
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add crates/forge-frontend/src/typecheck_v1.rs crates/forge-frontend/src/fir_v1.rs crates/forge-frontend/src/lib.rs crates/forge-frontend/tests/fir.rs crates/forge-frontend/tests/golden/fir_module_v1.json docs/fir-completion-plan.md
          git commit -m "Harden FIR boundary verification"
          git push origin HEAD:agent/fir-step16-work
