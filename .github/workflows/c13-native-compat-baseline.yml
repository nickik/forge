name: C13 native compatibility baseline

on:
  push:
    branches: [agent/cranelift-c13-native-existing-code]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nickik/CForge
          path: .cforge
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Forge compiler
        run: cargo build -p forge-compiler --bin forgec --locked
      - name: Materialize inspected Cosmic smoke case
        shell: bash
        run: |
          mkdir -p .cosmic/kernel/memory .cosmic/tests
          cat > .cosmic/kernel/memory/address_space.fg <<'EOF'
          module cosmic.kernel.memory.address_space;

          fn max_address() -> usize { return 4294967295; }

          pub fn page_size_valid(page_size: usize) -> bool {
              return (page_size != 0) && ((page_size & (page_size - 1)) == 0);
          }

          pub fn page_aligned(value: usize, page_size: usize) -> bool {
              if (!page_size_valid(page_size)) { return false; }
              return (value % page_size) == 0;
          }

          pub fn rights_allowed_values(
              requested_read: bool,
              requested_write: bool,
              requested_execute: bool,
              object_read: bool,
              object_write: bool,
              object_execute: bool
          ) -> bool {
              if (requested_read && !object_read) { return false; }
              if (requested_write && !object_write) { return false; }
              if (requested_execute && !object_execute) { return false; }
              return true;
          }

          pub fn ranges_overlap(a_base: usize, a_end: usize, b_base: usize, b_end: usize) -> bool {
              return (a_base < b_end) && (b_base < a_end);
          }

          pub fn mapping_conflicts_values(
              virtual_base: usize,
              virtual_size: usize,
              existing_base: usize,
              existing_size: usize
          ) -> bool {
              if (virtual_base > max_address() || existing_base > max_address()) { return true; }
              if (virtual_size == 0 || existing_size == 0) { return false; }
              if (virtual_size > (max_address() - virtual_base)) { return true; }
              if (existing_size > (max_address() - existing_base)) { return true; }
              val virtual_end: usize = virtual_base + virtual_size;
              val existing_end: usize = existing_base + existing_size;
              return ranges_overlap(virtual_base, virtual_end, existing_base, existing_end);
          }
          EOF
          cat > .cosmic/tests/address_space_minimal_test.fg <<'EOF'
          module cosmic.tests.address_space_minimal_test;

          import cosmic.kernel.memory.address_space;

          fn main() -> i32 {
              if (!address_space.page_size_valid(4096)) { return 1; }
              if (address_space.page_size_valid(0)) { return 2; }
              if (address_space.page_size_valid(3000)) { return 3; }
              if (!address_space.page_aligned(16384, 4096)) { return 4; }
              if (address_space.page_aligned(16385, 4096)) { return 5; }
              if (!address_space.rights_allowed_values(true, false, false, true, true, false)) { return 6; }
              if (!address_space.rights_allowed_values(true, true, false, true, true, false)) { return 7; }
              if (address_space.rights_allowed_values(true, true, false, true, false, false)) { return 8; }
              if (address_space.rights_allowed_values(true, false, true, true, true, false)) { return 9; }
              if (!address_space.ranges_overlap(4096, 12288, 8192, 16384)) { return 10; }
              if (address_space.ranges_overlap(4096, 8192, 8192, 12288)) { return 11; }
              if (address_space.ranges_overlap(16384, 20480, 4096, 8192)) { return 12; }
              if (!address_space.mapping_conflicts_values(16384, 8192, 20480, 4096)) { return 13; }
              if (address_space.mapping_conflicts_values(16384, 8192, 24576, 4096)) { return 14; }
              if (address_space.mapping_conflicts_values(16384, 8192, 8192, 8192)) { return 15; }
              if (!address_space.mapping_conflicts_values(4294963200, 8192, 4096, 4096)) { return 16; }
              return 0;
          }
          EOF
      - name: Probe existing CForge and Cosmic sources
        shell: bash
        run: |
          set +e
          fail=0
          run_case() {
            name="$1"
            shift
            echo "===== CASE: $name ====="
            "$@"
            rc=$?
            echo "===== RESULT: $name rc=$rc ====="
            if [ "$rc" -ne 0 ]; then fail=1; fi
            echo
          }

          FORGEC="$GITHUB_WORKSPACE/target/debug/forgec"

          run_case cforge-arithmetic \
            "$FORGEC" \
            --library "bootstrap_support=$GITHUB_WORKSPACE/.cforge/packages/bootstrap-support/src/lib.fg" \
            --run "$GITHUB_WORKSPACE/.cforge/harness/fixtures/smoke/arithmetic.fg"

          run_case cosmic-address-space-minimal \
            "$FORGEC" \
            --library "cosmic.kernel.memory.address_space=$GITHUB_WORKSPACE/.cosmic/kernel/memory/address_space.fg" \
            --run "$GITHUB_WORKSPACE/.cosmic/tests/address_space_minimal_test.fg"

          run_case cforge-game-of-life \
            "$FORGEC" \
            --library "std.console=$GITHUB_WORKSPACE/lib/std/console.fg" \
            --library "bootstrap_support=$GITHUB_WORKSPACE/.cforge/packages/bootstrap-support/src/lib.fg" \
            --run "$GITHUB_WORKSPACE/.cforge/examples/game_of_life.fg"

          exit "$fail"
