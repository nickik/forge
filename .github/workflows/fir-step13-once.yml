name: fir-step13-once

on:
  push:
    branches: [agent/fir-step13-work]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fir-step13-work
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply Step 13
        run: |
          python3 tools/fir_step13_fix.py
          python3 tools/fir_step13_fix2.py
          python3 tools/fir_step13_fix3.py
          python3 tools/fir_step13.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated Step 13
        run: |
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add crates/forge-frontend/src/typecheck_v1.rs crates/forge-frontend/src/fir_v1.rs crates/forge-frontend/src/lib.rs crates/forge-frontend/tests/typecheck.rs crates/forge-frontend/tests/fir.rs docs/fir-completion-plan.md
          git commit -m "Implement bitstruct FIR semantics"
          git push origin HEAD:agent/fir-step13-work
