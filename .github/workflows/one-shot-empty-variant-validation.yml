name: one-shot-empty-variant-validation

on:
  push:
    branches: [agent/conformance-runner]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply empty variant validation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - name: Reject empty enum and tagged declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/forge-frontend/src/parser_v1.rs')
          text = path.read_text()

          enum_marker = '        DeclKind::Enum(value) => {\n            for variant in &value.variants {'
          enum_replacement = '''        DeclKind::Enum(value) => {
            if value.variants.is_empty() {
                diagnostics.push(Diagnostic {
                    span: declaration.span,
                    message: "enum declarations require at least one variant".into(),
                });
            }
            for variant in &value.variants {'''
          tagged_marker = '        DeclKind::Tagged(value) => {\n            for variant in &value.variants {'
          tagged_replacement = '''        DeclKind::Tagged(value) => {
            if value.variants.is_empty() {
                diagnostics.push(Diagnostic {
                    span: declaration.span,
                    message: "tagged declarations require at least one variant".into(),
                });
            }
            for variant in &value.variants {'''

          if text.count(enum_marker) != 1:
              raise SystemExit(f'expected one enum marker, found {text.count(enum_marker)}')
          if text.count(tagged_marker) != 1:
              raise SystemExit(f'expected one tagged marker, found {text.count(tagged_marker)}')
          text = text.replace(enum_marker, enum_replacement, 1)
          text = text.replace(tagged_marker, tagged_replacement, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name 'forge-ci'
          git config user.email 'forge-ci@users.noreply.github.com'
          git add crates/forge-frontend/src/parser_v1.rs
          git commit -m 'Reject empty enum and tagged declarations'
          git push origin HEAD:agent/conformance-runner
