name: one-shot-empty-variant-validation

on:
  push:
    branches: [agent/conformance-runner]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry one-shot empty variant validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conformance-runner
      - name: Reject empty enum and tagged declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/forge-frontend/src/parser_v1.rs')
          text = path.read_text()

          enum_old = '''        DeclKind::Enum(value) => {
            for variant in &value.variants {
                if let Some(value) = &variant.value {
                    validate_expr(value, diagnostics);
                }
            }
        }
'''
          enum_new = '''        DeclKind::Enum(value) => {
            if value.variants.is_empty() {
                diagnostics.push(Diagnostic {
                    span: declaration.span,
                    message: "enum declarations require at least one variant".into(),
                });
            }
            for variant in &value.variants {
                if let Some(value) = &variant.value {
                    validate_expr(value, diagnostics);
                }
            }
        }
'''
          tagged_old = '''        DeclKind::Tagged(value) => {
            for variant in &value.variants {
                for field in &variant.fields {
                    if let Some(default) = &field.default {
                        validate_expr(default, diagnostics);
                    }
                }
            }
        }
'''
          tagged_new = '''        DeclKind::Tagged(value) => {
            if value.variants.is_empty() {
                diagnostics.push(Diagnostic {
                    span: declaration.span,
                    message: "tagged declarations require at least one variant".into(),
                });
            }
            for variant in &value.variants {
                for field in &variant.fields {
                    if let Some(default) = &field.default {
                        validate_expr(default, diagnostics);
                    }
                }
            }
        }
'''

          if enum_old not in text:
              raise SystemExit('enum validation block not found')
          if tagged_old not in text:
              raise SystemExit('tagged validation block not found')
          text = text.replace(enum_old, enum_new, 1).replace(tagged_old, tagged_new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name 'forge-ci'
          git config user.email 'forge-ci@users.noreply.github.com'
          git add crates/forge-frontend/src/parser_v1.rs
          git commit -m 'Reject empty enum and tagged declarations'
          git push origin HEAD:agent/conformance-runner
