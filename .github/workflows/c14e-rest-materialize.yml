name: C14e rest materialize

on:
  push:
    branches:
      - agent/c14e-rest-format-helper
    paths:
      - .github/workflows/c14e-rest-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c14e-rest-format-helper
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply sequence-rest lowering
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          old = base64.b64decode("").decode()
          new = base64.b64decode("").decode()
          fixture = base64.b64decode("").decode()
          path = Path("crates/forge-frontend/src/fir_v1.rs")
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one rest block, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          Path("examples/c14-native-spec/run/irrefutable_sequence_rest.fg").write_text(fixture)
          PY
          cargo fmt --all
      - name: Verify focused path
        shell: bash
        run: |
          cargo test -p forge-frontend --locked -- --nocapture
          cargo build -p forge-compiler --bin forgec --locked
          target/debug/forgec --library core=lib/core.fg --run examples/c14-native-spec/run/irrefutable_sequence_rest.fg
      - name: Commit semantic blobs
        shell: bash
        run: |
          git config user.name "Nick Zbinden"
          git config user.email "niklaus.zbinden@gmail.com"
          git add crates/forge-frontend/src/fir_v1.rs examples/c14-native-spec/run/irrefutable_sequence_rest.fg
          git commit -m "C14e: lower irrefutable sequence rest [skip ci]"
          git push origin HEAD:agent/c14e-rest-format-helper
