name: fir-step15-once
on:
  push:
    branches: [agent/fir-step15-work]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fir-step15-work
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply Step 15
        run: python3 tools/fir_step15.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p forge-conformance --locked -- examples/conformance/suite.fdn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A unused_mut -A clippy::collapsible_match -A clippy::large-enum-variant -A clippy::only-used-in-recursion
      - name: Commit validated Step 15
        run: |
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add crates/forge-frontend/src/body_hir_v1.rs crates/forge-frontend/src/typecheck_v1.rs crates/forge-frontend/src/fir_v1.rs crates/forge-frontend/src/lib.rs crates/forge-frontend/tests/typecheck.rs crates/forge-frontend/tests/fir.rs docs/fir-completion-plan.md
          git commit -m "Implement runtime global initialization"
          git push origin HEAD:agent/fir-step15-work
