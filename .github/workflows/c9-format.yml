name: c9-format

on:
  push:
    branches:
      - agent/cranelift-c9-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cranelift-c9-integration
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format C9 tree
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "C9: apply rustfmt [skip ci]"
          git push origin HEAD:agent/cranelift-c9-integration
