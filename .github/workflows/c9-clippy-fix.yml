name: c9-clippy-fix

on:
  push:
    branches:
      - agent/cranelift-c9-integration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cranelift-c9-integration
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply lint fix
        run: |
          sed -i 's/target.word_bits % 8 != 0/!target.word_bits.is_multiple_of(8)/' crates/forge-fir/src/abi_c9b_impl.rs
          cargo fmt --all
          rm .github/workflows/c9-clippy-fix.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "C9: satisfy strict Clippy [skip ci]"
          git push origin HEAD:agent/cranelift-c9-integration
