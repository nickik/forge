name: C14e captured closure materialization

on:
  push:
    branches:
      - agent/c14e-captured-closure-helper

permissions:
  contents: write

jobs:
  captured-closure:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Materialize captured closure ABI
        run: python3 scripts/c14e-captured-closure-materialize.py
      - name: Format materialized Rust
        run: cargo fmt --all
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Focused FIR closure ABI
        run: cargo test -p forge-fir --test closure_abi
      - name: Workspace check
        run: cargo check --workspace
      - name: Build forgec
        run: cargo build -p forge-compiler --bin forgec
      - name: Focused C14 native executable specification
        run: bash scripts/run-c14-native-spec.sh
      - name: Commit semantic captured closure patch
        run: |
          git config user.name "Nick Zbinden"
          git config user.email "niklaus.zbinden@gmail.com"
          git add \
            crates/forge-fir/src/layout_c9a.rs \
            crates/forge-fir/src/abi_c9b_impl.rs \
            crates/forge-fir/tests/closure_abi.rs \
            crates/forge-codegen-cranelift/src/completion.rs \
            crates/forge-codegen-cranelift/src/backend_c11d_legacy.rs \
            crates/forge-codegen-cranelift/src/function_c14_closure.rs \
            examples/c14-native-spec/run/captured_closure_abi.fg
          git commit -m "C14e: add cross-function captured closure ABI [closure-materialized] [skip ci]"
          git push origin HEAD:agent/c14e-captured-closure-helper
